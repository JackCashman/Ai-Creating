<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f49"><title>我的 IELTS 练习册</title><link rel="stylesheet" href="style.css"></head><body>
<header><span class="brand">READY / IELTS</span><button id="library">书架</button><button id="words">单词本</button></header>
<main><section id="welcome"><p class="eyebrow">开发版 · 功能与内容仍在接入</p><h1>把书翻开，<br>从这一页开始。</h1><p>原页对照与交互练习开发中。学习资料与记录保存在此设备。</p><label class="primary">导入私人学习包<input id="import" type="file" accept=".json" hidden></label><button id="demo">体验交互示例</button><p class="note">学习包包含书页与文字。示例仅用于体验，不是教材内容。</p></section>
<section id="reader" hidden><div class="chapter"><span id="title"></span><select id="pageSelect" aria-label="选择原书页码"></select></div><div class="tools"><button id="original">原页</button><button id="reflow">大字阅读</button><button id="backup">导出记录</button><label class="button">恢复记录<input id="restore" type="file" accept=".json" hidden></label></div><p id="review" class="note"></p><article id="paper"></article><nav><button id="prev">← 上一页</button><span id="position"></span><button id="next">下一页 →</button></nav><details><summary>音频与 AI 状态</summary><p>教材音频尚未核实接入。翻译、AI 对话与开源语音服务尚未配置，当前不会发送书籍或答案。</p></details></section>
</main><p id="status" role="status" aria-live="polite"></p>
<div id="selection" hidden><button id="underline">划线</button><button id="collect">收入单词本</button></div>
<dialog id="reading"><div class="dialogHead"><strong>阅读材料</strong><button data-close>完成</button></div><div id="passage"></div><div class="tools"><button id="readPrev">上一段</button><span id="readPosition"></span><button id="readNext">下一段</button><button id="undo">撤销划线</button></div><h3>相关题目</h3><div id="questions"></div></dialog>
<dialog id="wordDialog"><div class="dialogHead"><strong>我的单词本</strong><button data-close>完成</button></div><div id="wordList"></div><p class="note">开源发音服务尚未接入，听写播放暂不可用；已收藏内容可导出保存。</p></dialog>
<script type="module" src="app.js"></script></body></html>
